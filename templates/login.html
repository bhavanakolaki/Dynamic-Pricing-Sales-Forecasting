<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — PricingAI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',sans-serif; background:#0f172a; min-height:100vh;
         display:flex; align-items:center; justify-content:center; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:16px;
          padding:40px; width:100%; max-width:420px; }
  .logo { text-align:center; margin-bottom:32px; }
  .logo h1 { color:#6366f1; font-size:28px; font-weight:700; }
  .logo p  { color:#94a3b8; font-size:14px; margin-top:4px; }
  label { display:block; color:#cbd5e1; font-size:14px; margin-bottom:6px; margin-top:18px; }
  input { width:100%; padding:12px 16px; background:#0f172a; border:1px solid #334155;
          border-radius:8px; color:#f1f5f9; font-size:15px; outline:none; transition:.2s; }
  input:focus { border-color:#6366f1; }
  .btn { width:100%; padding:13px; background:#6366f1; color:#fff; border:none;
         border-radius:8px; font-size:16px; font-weight:600; cursor:pointer;
         margin-top:24px; transition:.2s; }
  .btn:hover { background:#4f46e5; }
  .msg { margin-top:14px; padding:12px; border-radius:8px; font-size:14px;
         text-align:center; display:none; }
  .msg.error   { background:#450a0a; color:#fca5a5; border:1px solid #7f1d1d; display:block; }
  .msg.success { background:#052e16; color:#86efac; border:1px solid #14532d; display:block; }
  .footer { text-align:center; margin-top:20px; color:#64748b; font-size:14px; }
  .footer a { color:#6366f1; text-decoration:none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>PricingAI</h1>
    <p>Dynamic Pricing & Sales Forecasting</p>
  </div>
  <div id="msg" class="msg"></div>
  <label>Email address</label>
  <input type="email" id="email" placeholder="you@example.com">
  <label>Password</label>
  <input type="password" id="password" placeholder="Enter your password">
  <button class="btn" onclick="doLogin()">Sign in</button>
  <div class="footer">
    Don't have an account? <a href="/register">Create one</a>
  </div>
</div>
<script>
async function doLogin() {
  const email    = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const msg      = document.getElementById("msg");
  msg.className  = "msg";
  if (!email || !password) {
    msg.textContent = "Please fill in all fields.";
    msg.className = "msg error"; return;
  }
  try {
    const res  = await fetch("/api/login", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem("token", data.token);
      localStorage.setItem("username", data.username);
      msg.textContent = "Login successful! Redirecting...";
      msg.className = "msg success";
      setTimeout(() => window.location.href = "/dashboard", 800);
    } else {
      msg.textContent = data.error || "Login failed.";
      msg.className = "msg error";
    }
  } catch {
    msg.textContent = "Cannot connect to server.";
    msg.className = "msg error";
  }
}
document.addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });
</script>
</body>
</html>
